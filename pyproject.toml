[build-system]
requires = [
    "setuptools",
    # Keep a tested upper bound on Cython: an unpinned requirement
    # previously let a broken new release fail every sdist build.
    # 3.0, 3.1 and 3.3 are verified (build + test suite).
    "cython>=3.0,<3.4",
]
build-backend = "setuptools.build_meta"